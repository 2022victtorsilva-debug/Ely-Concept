name: Deploy Ely Concept Pages

on:
  repository_dispatch:
    types: [deploy-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  statuses: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: https://2022victtorsilva-debug.github.io/Ely-Concept/
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish production files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Configure GitHub Pages to serve gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            try {
              await github.rest.repos.getPages(params);
              await github.rest.repos.updateInformationAboutPagesSite({
                ...params,
                build_type: 'legacy',
                source: { branch: 'gh-pages', path: '/' },
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createPagesSite({
                ...params,
                build_type: 'legacy',
                source: { branch: 'gh-pages', path: '/' },
              });
            }

      - name: Verify published page and hero asset
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(curl -fsSL --retry 18 --retry-delay 5 --retry-all-errors "$PAGE_URL")"
          printf '%s' "$HTML" | grep -q 'Ely Concept'
          curl -fsSL --retry 18 --retry-delay 5 --retry-all-errors -o /dev/null "${PAGE_URL}assets/hero-blonde.avif"

      - name: Publish Pages smoke-test status
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const ok = process.env.SMOKE_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pages-smoke-test',
              description: ok
                ? 'GitHub Pages and hero asset responded successfully'
                : 'Published page smoke test failed',
              target_url: process.env.PAGE_URL,
            });

      - name: Fail workflow when smoke test fails
        if: steps.smoke.outcome != 'success'
        run: exit 1
