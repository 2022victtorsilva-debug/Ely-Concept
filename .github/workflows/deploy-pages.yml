name: Deploy Ely Concept Pages

on:
  repository_dispatch:
    types: [deploy-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  statuses: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: https://2022victtorsilva-debug.github.io/Ely-Concept/
      TARGET_SHA: ${{ github.event.client_payload.source_sha || github.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare static site
        run: touch dist/.nojekyll

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C dist init
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add -A
          git -C dist commit -m "deploy: Ely Concept ${GITHUB_SHA}"
          git -C dist branch -M gh-pages
          git -C dist remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C dist push --force origin gh-pages

      - name: Configure GitHub Pages to serve gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: 'gh-pages', path: '/' };
            try {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                build_type: 'legacy',
                source,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                source,
              });
            }

      - name: Verify published page and hero asset
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(curl -fsSL --retry 36 --retry-delay 5 --retry-all-errors "$PAGE_URL")"
          printf '%s' "$HTML" | grep -q 'Ely Concept'
          curl -fsSL --retry 36 --retry-delay 5 --retry-all-errors -o /dev/null "${PAGE_URL}assets/hero-blonde.avif"

      - name: Publish Pages smoke-test status
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
          PAGE_URL: ${{ env.PAGE_URL }}
        with:
          script: |
            const ok = process.env.SMOKE_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: ok ? 'success' : 'failure',
              context: 'pages-smoke-test',
              description: ok
                ? 'Published page and hero asset responded successfully'
                : 'gh-pages publication or HTTP smoke test failed',
              target_url: process.env.PAGE_URL,
            });

      - name: Fail workflow when smoke test fails
        if: steps.smoke.outcome != 'success'
        run: exit 1
