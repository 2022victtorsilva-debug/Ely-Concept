name: Deploy Ely Concept Pages

on:
  repository_dispatch:
    types: [deploy-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: ely-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TARGET_SHA: ${{ github.event.client_payload.source_sha || github.sha }}
      FALLBACK_PAGE_URL: https://2022victtorsilva-debug.github.io/Ely-Concept/
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify published page and hero asset
        id: smoke
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          PAGE_URL="${PAGE_URL:-$FALLBACK_PAGE_URL}"
          PAGE_URL="${PAGE_URL%/}/"
          HTML="$(curl -fsSL --retry 24 --retry-delay 5 --retry-all-errors "$PAGE_URL")"
          printf '%s' "$HTML" | grep -q 'Ely Concept'
          curl -fsSL --retry 24 --retry-delay 5 --retry-all-errors -o /dev/null "${PAGE_URL}assets/hero-blonde.avif"

      - name: Publish Pages smoke-test status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FALLBACK_PAGE_URL: ${{ env.FALLBACK_PAGE_URL }}
        with:
          script: |
            const deployOk = process.env.DEPLOY_OUTCOME === 'success';
            const smokeOk = process.env.SMOKE_OUTCOME === 'success';
            const ok = deployOk && smokeOk;
            const targetUrl = process.env.PAGE_URL || process.env.FALLBACK_PAGE_URL;
            const description = ok
              ? 'GitHub Pages and hero asset responded successfully'
              : !deployOk
                ? 'GitHub Pages deployment action failed'
                : 'Deployment succeeded but HTTP smoke test failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: ok ? 'success' : 'failure',
              context: 'pages-smoke-test',
              description,
              target_url: targetUrl,
            });

      - name: Fail workflow when deploy or smoke test fails
        if: steps.deployment.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
