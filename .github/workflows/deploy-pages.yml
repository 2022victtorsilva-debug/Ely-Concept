name: Deploy Ely Concept Pages

on:
  repository_dispatch:
    types: [deploy-pages]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    if: always()
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Verify published page and hero asset
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_RESULT" = "success"
          test -n "$PAGE_URL"
          PAGE_URL="${PAGE_URL%/}/"
          HTML="$(curl -fsSL --retry 18 --retry-delay 5 --retry-all-errors "$PAGE_URL")"
          printf '%s' "$HTML" | grep -q 'Ely Concept'
          curl -fsSL --retry 18 --retry-delay 5 --retry-all-errors -o /dev/null "${PAGE_URL}assets/hero-blonde.avif"

      - name: Publish Pages smoke-test status
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const ok = process.env.SMOKE_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pages-smoke-test',
              description: ok
                ? 'GitHub Pages and hero asset responded successfully'
                : 'Deploy or published page smoke test failed',
              target_url: process.env.PAGE_URL || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
            });

      - name: Fail workflow when smoke test fails
        if: steps.smoke.outcome != 'success'
        run: exit 1
